name: tempat_in
description: Tempat-In - Empty room monitoring and booking app for Telkom University students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true